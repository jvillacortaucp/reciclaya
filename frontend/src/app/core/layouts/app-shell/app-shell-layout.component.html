<div class="min-h-screen max-w-full overflow-x-hidden bg-[#f1f3f8] antialiased">
  <!-- Topbar -->
  <app-topbar [canToggleSidebar]="showSidebar()" (toggleSidebar)="toggleSidebar()"></app-topbar>

  <!-- Sidebar -->
  @if (showSidebar()) {
    <app-sidebar 
      [isOpen]="isSidebarOpen()" 
      (closeSidebar)="closeSidebar()"
    ></app-sidebar>
  }

  <!-- Main Content -->
  @if (showSidebar()) {
    <main class="h-auto w-full max-w-full min-w-0 overflow-x-hidden px-4 pb-6 pt-20 md:pl-[17.5rem] md:pr-6 md:pt-24">
      <router-outlet />
    </main>
  } @else {
    <main class="h-auto w-full max-w-full min-w-0 overflow-x-hidden px-4 pb-6 pt-20 md:px-6 md:pt-24">
      <router-outlet />
    </main>
  }

  <!-- Backdrop for mobile -->
  @if (showSidebar() && isSidebarOpen()) {
    <div 
      class="fixed inset-0 z-30 bg-gray-900/50 dark:bg-gray-900/80 md:hidden"
      (click)="closeSidebar()"
    ></div>
  }

  @if (!isAssistantChatRoute()) {
    <div class="relative button-0">
      <app-default-chat-bubble
        title="Chatea con nosotros"
        message="Hola, soy Eco, ¿Qué reciclaremos hoy?"
        ariaLabel="Abrir chat con Eco"
        quickActionLabel="Seguir mi pedido"
        placeholder="Escribe un mensaje"
        [messages]="ecoMessages()"
        [typing]="ecoTyping()"
        [disabledInput]="ecoDisabledInput()"
        [showGoToMainChatCta]="ecoShowGoToMainChatCta()"
        goToMainChatLabel="Ir al chat principal"
        (quickActionClick)="openEcoChat()"
        (messageSubmit)="openEcoChatWithMessage($event)"
        (goToMainChatClick)="goToMainEcoChat()" />
    </div>
  }
</div>
