<div class="space-y-3 pointer-events-auto">
  <button
    type="button"
    class="h-14 w-full rounded-3xl bg-emerald-700 text-lg font-semibold text-white shadow-sm transition hover:bg-emerald-800"
    (click)="processRequested.emit()">
    Ver proceso
  </button>

  <button
    type="button"
    class="inline-flex h-14 w-full items-center justify-center gap-2 rounded-3xl border border-slate-200 bg-white text-lg font-semibold text-slate-700 transition hover:bg-slate-50"
    (click)="complexityRequested.emit()">
    <svg lucideEye class="h-5 w-5"></svg>
    Ver nivel de complejidad
  </button>

  <button
    type="button"
    class="inline-flex h-14 w-full items-center justify-center gap-2 rounded-3xl border border-slate-200 bg-white text-lg font-semibold text-emerald-700 transition hover:bg-emerald-50"
    (click)="marketRequested.emit()">
    Ver análisis de mercado
    <svg lucideExternalLink class="h-5 w-5"></svg>
  </button>
</div>
