<div class="space-y-4 pointer-events-none">
  <div class="mb-5 flex flex-wrap items-center justify-between gap-3">
    <div>
      <p class="text-xs font-semibold uppercase tracking-[0.14em] text-emerald-600">{{ route().routeName }}</p>
      <h3 class="mt-1 text-2xl font-semibold text-slate-900">Opciones sugeridas</h3>
    </div>

    <button
      type="button"
      class="pointer-events-auto inline-flex items-center gap-2 rounded-full border border-slate-200 bg-white px-4 py-2 text-sm font-semibold text-slate-700 transition hover:bg-slate-50"
      (click)="backRequested.emit()">
      <svg lucideArrowLeft class="h-4 w-4"></svg>
      Regresar
    </button>
  </div>

  <div class="relative">
    <svg class="pointer-events-none absolute inset-0 hidden h-full w-full lg:block" viewBox="0 0 1200 320" fill="none">
      <line x1="300" y1="40" x2="300" y2="280" stroke="#10b981" stroke-opacity="0.25" stroke-dasharray="6 6" />
      <line x1="900" y1="40" x2="900" y2="280" stroke="#10b981" stroke-opacity="0.25" stroke-dasharray="6 6" />
      <line x1="300" y1="160" x2="900" y2="160" stroke="#10b981" stroke-opacity="0.25" stroke-dasharray="6 6" />
    </svg>

    <div class="grid gap-4 md:grid-cols-2">
      @for (product of route().products; track product.id) {
        <button
          type="button"
          class="pointer-events-auto group rounded-3xl border bg-white p-5 text-left shadow-sm transition-all duration-300 hover:-translate-y-0.5 hover:shadow-md"
          [attr.data-product-card-id]="product.id"
          [class.border-emerald-500]="selectedProductId() === product.id"
          [class.ring-2]="selectedProductId() === product.id"
          [class.ring-emerald-100]="selectedProductId() === product.id"
          [class.border-slate-200]="selectedProductId() !== product.id"
          (click)="productSelected.emit(product.id)">
          <div class="flex items-center justify-between gap-2">
            <span class="inline-flex items-center gap-2 rounded-xl bg-emerald-50 px-2.5 py-1 text-[11px] font-bold text-emerald-700">
              <svg lucideBadgeCheck class="h-3.5 w-3.5"></svg>
              {{ phaseLabel(product) }}
            </span>
            <span class="inline-flex items-center rounded-md bg-amber-50 px-2 py-1 text-[11px] font-semibold text-amber-700">
              {{ product.marketPotential === 'high' ? 'TOP DEMAND' : 'VALIDACIÓN' }}
            </span>
          </div>

          <p class="mt-4 text-2xl font-semibold text-slate-900">{{ product.name }}</p>
          <p class="mt-2 line-clamp-3 text-sm leading-relaxed text-slate-600">{{ product.description }}</p>

          <div class="mt-5 grid grid-cols-2 gap-3 border-t border-slate-100 pt-4 text-sm">
            <p class="text-slate-500">Yield: <span class="font-semibold text-indigo-600">{{ yieldLabel(product) }}</span></p>
            <p class="text-right text-emerald-700 font-semibold">{{ estimatedPrice(product) }}</p>
          </div>
        </button>
      }
    </div>
  </div>
</div>
