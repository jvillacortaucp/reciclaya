<div class="relative aspect-[1000/520] w-full min-w-[620px] pointer-events-none">
  <svg class="pointer-events-none absolute inset-0 h-full w-full" viewBox="0 0 1000 520" fill="none" preserveAspectRatio="xMidYMid meet">
    @for (route of visibleRoutes(); track route.id; let i = $index) {
      <line
        [attr.x1]="500"
        [attr.y1]="260"
        [attr.x2]="routeCoords[i].x === 18 ? 270 : 730"
        [attr.y2]="routeCoords[i].y === 8 ? 130 : 390"
        stroke="url(#routeLine)"
        stroke-width="2"
        stroke-dasharray="5 5" />
    }
    <defs>
      <linearGradient id="routeLine" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#10b981" stop-opacity="0.7" />
        <stop offset="100%" stop-color="#0f766e" stop-opacity="0.18" />
      </linearGradient>
    </defs>
  </svg>

  @for (route of visibleRoutes(); track route.id; let i = $index) {
    <button
      type="button"
      data-panzoom-ignore
      class="pointer-events-auto absolute w-[130px] rounded-3xl border bg-white p-3 text-center shadow-sm transition-all duration-300 hover:-translate-y-1 hover:shadow-lg sm:w-[150px] sm:p-4 md:w-44"
      [attr.data-route-card-id]="route.id"
      [style.left.%]="routeCoords[i].x"
      [style.top.%]="routeCoords[i].y"
      [class.border-emerald-400]="selectedRouteId() === route.id"
      [class.ring-2]="selectedRouteId() === route.id"
      [class.ring-emerald-100]="selectedRouteId() === route.id"
      [class.border-slate-200]="selectedRouteId() !== route.id"
      (click)="onSelect(route.id)">
      <span class="mx-auto inline-flex h-10 w-10 items-center justify-center rounded-2xl sm:h-11 sm:w-11 md:h-12 md:w-12" [class]="iconBgClass(route)">
        @switch (route.iconName) {
          @case ('utensils') { <svg lucideUtensils class="h-4 w-4 sm:h-5 sm:w-5"></svg> }
          @case ('sparkles') { <svg lucideSparkles class="h-4 w-4 sm:h-5 sm:w-5"></svg> }
          @case ('pill') { <svg lucidePill class="h-4 w-4 sm:h-5 sm:w-5"></svg> }
          @case ('sprout') { <svg lucideSprout class="h-4 w-4 sm:h-5 sm:w-5"></svg> }
          @case ('flame') { <svg lucideFlame class="h-4 w-4 sm:h-5 sm:w-5"></svg> }
          @default { <svg lucidePackage class="h-4 w-4 sm:h-5 sm:w-5"></svg> }
        }
      </span>
      <p class="mt-2 text-xs font-semibold text-slate-700 sm:text-sm">{{ route.routeName }}</p>
      <div class="mx-auto mt-2 h-px w-16 bg-slate-200 sm:w-20"></div>
      <p class="mt-2 text-[9px] font-semibold uppercase tracking-[0.14em] text-slate-400 sm:text-[10px]">Match score</p>
      <p class="text-2xl font-bold text-emerald-600 sm:text-3xl">{{ matchPercent(route) }}%</p>
    </button>
  }

  <div data-panzoom-ignore class="pointer-events-auto absolute left-1/2 top-1/2 w-44 -translate-x-1/2 -translate-y-1/2 rounded-full border-2 border-emerald-500/70 bg-white p-4 text-center shadow-lg sm:w-52 sm:p-5 md:w-56">
    <div class="mx-auto inline-flex h-12 w-12 items-center justify-center rounded-2xl bg-emerald-700 text-white shadow-md sm:h-14 sm:w-14 md:h-16 md:w-16">
      <svg lucideSprout class="h-6 w-6 sm:h-7 sm:w-7 md:h-8 md:w-8"></svg>
    </div>
    <p class="mt-2 text-xs font-semibold text-slate-800 sm:text-sm">{{ residueLabel() }}</p>
    <p class="mt-1 text-[9px] uppercase tracking-[0.14em] text-slate-400 sm:text-[10px]">ID base · eco2026</p>
  </div>
</div>
