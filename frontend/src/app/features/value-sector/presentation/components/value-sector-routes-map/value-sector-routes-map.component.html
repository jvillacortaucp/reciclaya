<div class="relative pointer-events-none">
  <div class="relative hidden min-h-[430px] w-full max-w-[1000px] items-center justify-center md:flex pointer-events-none">
    <svg class="pointer-events-none absolute inset-0 h-full w-full" viewBox="0 0 1000 430" fill="none">
      @for (route of visibleRoutes(); track route.id; let i = $index) {
        <line
          [attr.x1]="500"
          [attr.y1]="230"
          [attr.x2]="i === 0 ? 280 : i === 1 ? 280 : i === 2 ? 720 : 720"
          [attr.y2]="i === 0 ? 120 : i === 1 ? 340 : i === 2 ? 120 : 340"
          stroke="url(#routeLine)"
          stroke-width="2"
          stroke-dasharray="5 5" />
      }
      <defs>
        <linearGradient id="routeLine" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#10b981" stop-opacity="0.7" />
          <stop offset="100%" stop-color="#0f766e" stop-opacity="0.18" />
        </linearGradient>
      </defs>
    </svg>

    @for (route of visibleRoutes(); track route.id; let i = $index) {
      <button
        type="button"
        class="pointer-events-auto absolute w-44 rounded-3xl border bg-white p-4 text-center shadow-sm transition-all duration-300 hover:-translate-y-1 hover:shadow-lg"
        [attr.data-route-card-id]="route.id"
        [class.left-[192px]]="i === 0 || i === 1"
        [class.left-[632px]]="i === 2 || i === 3"
        [class.top-[40px]]="i === 0 || i === 2"
        [class.top-[260px]]="i === 1 || i === 3"
        [class.border-emerald-400]="selectedRouteId() === route.id"
        [class.ring-2]="selectedRouteId() === route.id"
        [class.ring-emerald-100]="selectedRouteId() === route.id"
        [class.border-slate-200]="selectedRouteId() !== route.id"
        (click)="onSelect(route.id)">
        <span class="mx-auto inline-flex h-12 w-12 items-center justify-center rounded-2xl" [class]="iconBgClass(route)">
          @switch (route.iconName) {
            @case ('utensils') { <svg lucideUtensils class="h-5 w-5"></svg> }
            @case ('sparkles') { <svg lucideSparkles class="h-5 w-5"></svg> }
            @case ('pill') { <svg lucidePill class="h-5 w-5"></svg> }
            @case ('sprout') { <svg lucideSprout class="h-5 w-5"></svg> }
            @case ('flame') { <svg lucideFlame class="h-5 w-5"></svg> }
            @default { <svg lucidePackage class="h-5 w-5"></svg> }
          }
        </span>
        <p class="mt-3 text-sm font-semibold text-slate-700">{{ route.routeName }}</p>
        <div class="mx-auto mt-3 h-px w-20 bg-slate-200"></div>
        <p class="mt-2 text-[10px] font-semibold uppercase tracking-[0.16em] text-slate-400">Match score</p>
        <p class="text-3xl font-bold text-emerald-600">{{ matchPercent(route) }}%</p>
      </button>
    }

    <div class="pointer-events-auto absolute left-1/2 top-1/2 w-56 -translate-x-1/2 -translate-y-1/2 rounded-full border-2 border-emerald-500/70 bg-white p-5 text-center shadow-lg">
      <div class="mx-auto inline-flex h-16 w-16 items-center justify-center rounded-2xl bg-emerald-700 text-white shadow-md">
        <svg lucideSprout class="h-8 w-8"></svg>
      </div>
      <p class="mt-3 text-sm font-semibold text-slate-800">{{ residueLabel() }}</p>
      <p class="mt-1 text-[10px] uppercase tracking-[0.16em] text-slate-400">ID base · eco2026</p>
    </div>
  </div>

  <div class="grid gap-4 md:hidden">
    @for (route of visibleRoutes(); track route.id) {
      <button
        type="button"
        class="pointer-events-auto rounded-2xl border border-slate-200 bg-white px-4 py-3 text-left shadow-sm transition hover:border-emerald-300 hover:bg-emerald-50"
          (click)="onSelect(route.id)">
        <p class="text-base font-semibold text-slate-800">{{ route.routeName }}</p>
        <p class="mt-1 text-sm text-slate-500">Potencial {{ matchPercent(route) }}%</p>
      </button>
    }
  </div>
</div>
