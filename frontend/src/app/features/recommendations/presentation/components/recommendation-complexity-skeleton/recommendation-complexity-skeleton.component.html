<section class="space-y-6" data-tour="recommendations-complexity-skeleton">
  <section class="overflow-hidden rounded-[30px] border border-slate-200/90 bg-[radial-gradient(circle_at_top_left,_rgba(16,185,129,0.08),_transparent_34%),linear-gradient(135deg,_rgba(255,255,255,1)_0%,_rgba(248,250,252,0.98)_52%,_rgba(236,253,245,0.85)_100%)] p-5 shadow-sm ring-1 ring-slate-100/70 sm:p-6 xl:p-7">
    <div class="space-y-5">
      <div class="flex flex-wrap items-center gap-2.5">
        <div class="skeleton-block h-8 w-44 rounded-full"></div>
        <div class="skeleton-block h-8 w-64 rounded-full"></div>
      </div>

      <div class="space-y-4">
        <div class="flex flex-col gap-4 lg:flex-row lg:items-end lg:justify-between">
          <div class="space-y-3">
            <div class="skeleton-block h-10 w-72 rounded-2xl sm:w-96"></div>
            <div class="skeleton-block h-4 w-full max-w-3xl rounded-full"></div>
            <div class="skeleton-block h-4 w-2/3 max-w-2xl rounded-full"></div>
          </div>
          <div class="skeleton-block h-10 w-40 rounded-full"></div>
        </div>

        <div class="rounded-2xl border border-white/80 bg-white/75 p-4 shadow-sm">
          <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
            <div class="flex-1 space-y-2">
              <div class="skeleton-block h-3 w-32 rounded-full"></div>
              <div class="skeleton-block h-4 w-full rounded-full"></div>
              <div class="skeleton-block h-4 w-3/4 rounded-full"></div>
            </div>
            <div class="space-y-2">
              <div class="skeleton-block h-8 w-20 rounded-2xl"></div>
              <div class="skeleton-block h-3 w-24 rounded-full"></div>
            </div>
          </div>
          <div class="skeleton-block mt-4 h-3 w-full rounded-full"></div>
        </div>

        <div class="grid gap-4 md:grid-cols-2">
          <div class="rounded-[26px] border border-slate-200/90 bg-white/90 p-5 shadow-sm space-y-3">
            <div class="skeleton-block h-10 w-10 rounded-2xl"></div>
            <div class="skeleton-block h-3 w-28 rounded-full"></div>
            <div class="skeleton-block h-4 w-full rounded-full"></div>
            <div class="skeleton-block h-4 w-5/6 rounded-full"></div>
          </div>
          <div class="rounded-[26px] border border-emerald-200 bg-emerald-50/50 p-5 shadow-sm space-y-3">
            <div class="skeleton-block h-10 w-10 rounded-2xl"></div>
            <div class="skeleton-block h-3 w-28 rounded-full"></div>
            <div class="skeleton-block h-4 w-full rounded-full"></div>
            <div class="skeleton-block h-4 w-2/3 rounded-full"></div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section class="grid grid-cols-1 gap-4 md:grid-cols-2 2xl:grid-cols-12">
    @for (item of items; track item) {
      <article class="rounded-[26px] border border-slate-200/90 bg-white p-5 shadow-sm 2xl:col-span-4">
        <div class="space-y-4">
          <div class="flex items-start justify-between gap-3">
            <div class="flex items-start gap-3">
              <div class="skeleton-block h-11 w-11 rounded-2xl"></div>
              <div class="space-y-2">
                <div class="skeleton-block h-3 w-24 rounded-full"></div>
                <div class="skeleton-block h-5 w-40 rounded-full"></div>
              </div>
            </div>
            <div class="skeleton-block hidden h-6 w-10 rounded-full sm:block"></div>
          </div>
          <div class="rounded-2xl border border-slate-200/80 bg-slate-50/70 p-4 space-y-2">
            <div class="skeleton-block h-4 w-full rounded-full"></div>
            <div class="skeleton-block h-4 w-5/6 rounded-full"></div>
            <div class="skeleton-block h-4 w-2/3 rounded-full"></div>
          </div>
        </div>
      </article>
    }
  </section>
</section>
