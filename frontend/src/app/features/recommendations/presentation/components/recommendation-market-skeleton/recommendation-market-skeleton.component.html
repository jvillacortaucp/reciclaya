<article
  data-tour="market-buyers-skeleton"
  class="rounded-[28px] border border-slate-200/90 bg-white p-5 shadow-sm ring-1 ring-slate-100/60 sm:p-6">
  <div class="space-y-2">
    <div class="skeleton-block h-8 w-60 rounded-2xl"></div>
    <div class="skeleton-block h-4 w-full max-w-xl rounded-full"></div>
  </div>

  <div class="mt-6 grid gap-6 xl:grid-cols-[360px_minmax(0,1fr)] xl:items-start">
    <div class="space-y-4">
      @for (buyer of buyers; track buyer) {
        <article class="rounded-2xl border border-slate-200/90 bg-slate-50/55 p-4 shadow-sm sm:p-5">
          <div class="space-y-4">
            <div class="flex flex-col gap-3">
              <div class="flex items-start gap-3">
                <div class="skeleton-block h-11 w-11 rounded-full"></div>
                <div class="min-w-0 flex-1 space-y-2">
                  <div class="skeleton-block h-5 w-4/5 rounded-full"></div>
                  <div class="skeleton-block h-4 w-2/3 rounded-full"></div>
                </div>
              </div>
              <div class="skeleton-block h-8 w-20 rounded-full"></div>
            </div>

            <div class="grid gap-3">
              <div class="rounded-xl border border-slate-200/80 bg-white px-3.5 py-3 space-y-2">
                <div class="skeleton-block h-3 w-16 rounded-full"></div>
                <div class="skeleton-block h-4 w-2/3 rounded-full"></div>
              </div>
              <div class="rounded-xl border border-slate-200/80 bg-white px-3.5 py-3 space-y-2">
                <div class="skeleton-block h-3 w-16 rounded-full"></div>
                <div class="skeleton-block h-4 w-full rounded-full"></div>
              </div>
              <div class="rounded-xl border border-slate-200/80 bg-white px-3.5 py-3 space-y-2">
                <div class="skeleton-block h-3 w-16 rounded-full"></div>
                <div class="skeleton-block h-4 w-1/2 rounded-full"></div>
              </div>
            </div>
          </div>
        </article>
      }
    </div>

    <div class="rounded-[24px] border border-slate-200/90 bg-white p-4 shadow-sm ring-1 ring-slate-100/60 sm:p-5">
      <div class="mb-4 space-y-2">
        <div class="skeleton-block h-6 w-52 rounded-2xl"></div>
        <div class="skeleton-block h-4 w-full max-w-lg rounded-full"></div>
      </div>

      <div class="rounded-[24px] border border-slate-200/60 bg-slate-50/35 p-4">
        <div class="mb-4 flex items-center justify-end">
          <div class="skeleton-block h-12 w-64 rounded-2xl"></div>
        </div>
        <div class="skeleton-block h-[680px] w-full rounded-[22px]"></div>
      </div>
    </div>
  </div>
</article>
