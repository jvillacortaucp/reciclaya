<section class="mt-6 grid gap-4 lg:grid-cols-2 2xl:grid-cols-3" data-tour="recommendations-commercial-skeleton">
  @for (card of cards; track card) {
    <article class="rounded-3xl border border-slate-200 bg-white p-6 shadow-sm">
      <div class="flex items-start justify-between gap-4">
        <div class="space-y-2">
          <div class="skeleton-block h-3 w-28 rounded-full"></div>
          <div class="skeleton-block h-7 w-56 rounded-2xl"></div>
          <div class="skeleton-block h-3 w-24 rounded-full"></div>
        </div>
        <div class="skeleton-block h-8 w-16 rounded-full"></div>
      </div>

      <div class="mt-4 space-y-2">
        <div class="skeleton-block h-4 w-full rounded-full"></div>
        <div class="skeleton-block h-4 w-11/12 rounded-full"></div>
        <div class="skeleton-block h-4 w-2/3 rounded-full"></div>
      </div>

      <div class="mt-4 space-y-2">
        <div class="skeleton-block h-4 w-1/2 rounded-full"></div>
        <div class="skeleton-block h-4 w-2/3 rounded-full"></div>
      </div>

      <div class="mt-6 flex items-center justify-between gap-3">
        <div class="skeleton-block h-4 w-32 rounded-full"></div>
        <div class="skeleton-block h-10 w-28 rounded-2xl"></div>
      </div>
    </article>
  }
</section>
