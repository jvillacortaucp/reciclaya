<section class="space-y-6" data-tour="recommendations-financial-skeleton">
  <div class="grid min-w-0 grid-cols-1 gap-6 xl:grid-cols-[minmax(0,1fr)_380px]">
    <div class="min-w-0 space-y-6">
      <article class="overflow-hidden rounded-[30px] border border-slate-200 bg-white shadow-sm">
        <div class="grid min-h-[280px] grid-cols-1 md:grid-cols-[280px_minmax(0,1fr)]">
          <div class="skeleton-block h-full min-h-[220px] w-full"></div>
          <div class="space-y-4 p-6">
            <div class="skeleton-block h-10 w-64 rounded-2xl"></div>
            <div class="skeleton-block h-8 w-80 rounded-full"></div>
            <div class="grid gap-4 md:grid-cols-2">
              <div class="rounded-2xl border border-slate-200/80 bg-slate-50/70 p-4 space-y-3">
                <div class="skeleton-block h-3 w-24 rounded-full"></div>
                <div class="skeleton-block h-4 w-full rounded-full"></div>
                <div class="skeleton-block h-4 w-5/6 rounded-full"></div>
                <div class="skeleton-block h-4 w-2/3 rounded-full"></div>
              </div>
              <div class="rounded-2xl border border-slate-200/80 bg-slate-50/70 p-4 space-y-3">
                <div class="skeleton-block h-3 w-24 rounded-full"></div>
                <div class="skeleton-block h-4 w-2/3 rounded-full"></div>
                <div class="skeleton-block h-4 w-1/2 rounded-full"></div>
              </div>
            </div>
            <div class="skeleton-block h-px w-full"></div>
            <div class="flex items-center justify-between gap-4">
              <div class="skeleton-block h-6 w-40 rounded-full"></div>
              <div class="skeleton-block h-12 w-36 rounded-2xl"></div>
            </div>
          </div>
        </div>
      </article>

      <section class="grid gap-3 md:grid-cols-3">
        @for (kpi of kpis; track kpi) {
          <article class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
            <div class="flex items-center gap-3">
              <div class="skeleton-block h-10 w-10 rounded-xl"></div>
              <div class="space-y-2">
                <div class="skeleton-block h-3 w-28 rounded-full"></div>
                <div class="skeleton-block h-8 w-24 rounded-2xl"></div>
              </div>
            </div>
            <div class="mt-3 space-y-2">
              <div class="skeleton-block h-3 w-full rounded-full"></div>
              <div class="skeleton-block h-2 w-full rounded-full"></div>
            </div>
          </article>
        }
      </section>

      <article class="rounded-3xl border border-slate-200 bg-white p-5 shadow-sm">
        <div class="flex flex-wrap items-center justify-between gap-3">
          <div class="skeleton-block h-8 w-72 rounded-2xl"></div>
          <div class="skeleton-block h-10 w-24 rounded-xl"></div>
        </div>

        <div class="mt-4 grid gap-4 lg:grid-cols-[minmax(0,1fr)_320px]">
          <div class="rounded-2xl border border-slate-100 bg-slate-50 p-4">
            <div class="skeleton-block h-4 w-48 rounded-full"></div>
            <div class="mt-4 space-y-4">
              @for (row of costRows; track row) {
                <div class="space-y-2">
                  <div class="flex items-center justify-between gap-3">
                    <div class="skeleton-block h-4 w-2/3 rounded-full"></div>
                    <div class="skeleton-block h-4 w-12 rounded-full"></div>
                  </div>
                  <div class="skeleton-block h-2 w-full rounded-full"></div>
                </div>
              }
            </div>
          </div>

          <div class="space-y-4">
            <div class="rounded-2xl border border-slate-200 bg-slate-50 p-4">
              <div class="flex items-center justify-between gap-3">
                <div class="skeleton-block h-3 w-32 rounded-full"></div>
                <div class="skeleton-block h-10 w-28 rounded-xl"></div>
              </div>
              <div class="mt-5 flex justify-center">
                <div class="skeleton-block h-52 w-52 rounded-full"></div>
              </div>
              <div class="mt-4 flex flex-wrap justify-center gap-3">
                @for (row of [1,2,3,4]; track row) {
                  <div class="skeleton-block h-4 w-12 rounded-full"></div>
                }
              </div>
            </div>
            <div class="rounded-2xl border border-emerald-200 bg-emerald-50 p-4 space-y-3">
              <div class="skeleton-block h-3 w-40 rounded-full"></div>
              <div class="skeleton-block h-12 w-28 rounded-2xl"></div>
              <div class="skeleton-block h-4 w-full rounded-full"></div>
            </div>
          </div>
        </div>
      </article>
    </div>

    <aside class="space-y-4">
      <article class="overflow-hidden rounded-3xl border border-slate-200 bg-white shadow-sm">
        <div class="bg-emerald-600 p-5">
          <div class="skeleton-block h-8 w-48 rounded-2xl bg-white/30"></div>
        </div>
        <div class="space-y-4 p-5">
          @for (row of [1,2,3,4]; track row) {
            <div class="flex items-center justify-between gap-3">
              <div class="skeleton-block h-4 w-28 rounded-full"></div>
              <div class="skeleton-block h-8 w-32 rounded-2xl"></div>
            </div>
          }
        </div>
      </article>

      <article class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
        <div class="skeleton-block h-8 w-44 rounded-2xl"></div>
        <div class="mt-4 space-y-4">
          @for (step of steps; track step) {
            <div class="flex items-start gap-3">
              <div class="skeleton-block h-6 w-6 rounded-full"></div>
              <div class="min-w-0 flex-1 space-y-2">
                <div class="skeleton-block h-4 w-full rounded-full"></div>
                <div class="skeleton-block h-4 w-5/6 rounded-full"></div>
              </div>
            </div>
          }
        </div>
      </article>

      <article class="rounded-2xl border border-amber-200 bg-amber-50 p-4 shadow-sm">
        <div class="skeleton-block h-4 w-20 rounded-full"></div>
        <div class="mt-3 space-y-2">
          <div class="skeleton-block h-4 w-full rounded-full"></div>
          <div class="skeleton-block h-4 w-11/12 rounded-full"></div>
          <div class="skeleton-block h-4 w-2/3 rounded-full"></div>
        </div>
      </article>
    </aside>
  </div>
</section>
