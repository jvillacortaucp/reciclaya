<section class="space-y-6" data-tour="recommendations-process-skeleton">
  <section class="overflow-hidden rounded-[30px] border border-slate-200/90 bg-white p-5 shadow-sm ring-1 ring-slate-100/70 sm:p-6 xl:p-7">
    <div class="space-y-5">
      <div class="flex flex-wrap items-center gap-2.5">
        <div class="skeleton-block h-8 w-44 rounded-full"></div>
        <div class="skeleton-block h-8 w-72 rounded-full"></div>
      </div>

      <div class="flex flex-col gap-4 lg:flex-row lg:items-end lg:justify-between">
        <div class="min-w-0 space-y-3">
          <div class="skeleton-block h-10 w-72 rounded-2xl sm:w-96"></div>
          <div class="skeleton-block h-4 w-full max-w-3xl rounded-full"></div>
          <div class="skeleton-block h-4 w-3/4 max-w-2xl rounded-full"></div>
        </div>

        <div class="skeleton-block h-12 w-44 rounded-2xl"></div>
      </div>
    </div>
  </section>

  <section class="grid grid-cols-1 gap-4 xl:grid-cols-[320px_minmax(0,1fr)]">
    <article class="rounded-[26px] border border-slate-200/90 bg-white p-5 shadow-sm">
      <div class="space-y-4">
        <div class="skeleton-block h-6 w-36 rounded-full"></div>
        @for (step of steps; track step) {
          <div class="flex items-start gap-3 rounded-2xl border border-slate-200/80 bg-slate-50/70 p-4">
            <div class="skeleton-block h-11 w-11 shrink-0 rounded-2xl"></div>
            <div class="min-w-0 flex-1 space-y-2">
              <div class="skeleton-block h-4 w-4/5 rounded-full"></div>
              <div class="skeleton-block h-3 w-full rounded-full"></div>
              <div class="skeleton-block h-3 w-3/4 rounded-full"></div>
            </div>
          </div>
        }
      </div>
    </article>

    <article class="rounded-[26px] border border-slate-200/90 bg-white p-5 shadow-sm">
      <div class="space-y-4">
        <div class="skeleton-block h-7 w-56 rounded-full"></div>
        <div class="grid gap-4 md:grid-cols-2">
          <div class="rounded-2xl border border-slate-200/80 bg-slate-50/60 p-4 space-y-3">
            <div class="skeleton-block h-4 w-28 rounded-full"></div>
            <div class="skeleton-block h-4 w-full rounded-full"></div>
            <div class="skeleton-block h-4 w-5/6 rounded-full"></div>
            <div class="skeleton-block h-20 w-full rounded-2xl"></div>
          </div>
          <div class="rounded-2xl border border-slate-200/80 bg-slate-50/60 p-4 space-y-3">
            <div class="skeleton-block h-4 w-32 rounded-full"></div>
            <div class="skeleton-block h-4 w-full rounded-full"></div>
            <div class="skeleton-block h-4 w-2/3 rounded-full"></div>
            <div class="skeleton-block h-20 w-full rounded-2xl"></div>
          </div>
        </div>
      </div>
    </article>
  </section>
</section>
