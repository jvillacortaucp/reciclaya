<article class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
  <div class="flex flex-wrap items-start justify-between gap-3">
    <div class="min-w-0 flex-1">
      <div class="flex flex-wrap items-center gap-2">
        <h4 class="text-base font-semibold text-slate-900">{{ requirement.title }}</h4>
        <span
          class="inline-flex items-center rounded-full px-2.5 py-1 text-[11px] font-semibold"
          [class]="requirement.required ? 'bg-rose-100 text-rose-700' : 'bg-slate-100 text-slate-600'"
        >
          {{ requirement.required ? 'Obligatorio' : 'Recomendable' }}
        </span>
        <span class="inline-flex items-center rounded-full bg-slate-100 px-2.5 py-1 text-[11px] font-semibold text-slate-600">
          {{ actorLabels[requirement.actorType] }}
        </span>
      </div>
      <p class="mt-2 text-sm leading-6 text-slate-600">{{ requirement.description }}</p>
      @if (requirement.notes) {
        <p class="mt-2 text-xs text-slate-500">{{ requirement.notes }}</p>
      }
    </div>

    <app-compliance-status-badge kind="requirement" [value]="requirement.currentStatus" />
  </div>

  <div class="mt-4">
    <app-compliance-file-upload
      [requirement]="requirement"
      [disabled]="disabled"
      (fileSelected)="fileSelected.emit($event)"
      (removeFile)="removeFile.emit()"
    />
  </div>
</article>
